<text class="v" x="320" y="323">0.50% TOLERANCE</text>

<rect class="b" x="444" y="296" width="180" height="34"/>
<text class="s" x="534" y="308">TEST SUITE</text>
<text class="v" x="534" y="323">16 TESTS</text>
