<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">
<title>PN-06 mixpriors pipeline</title>
<desc>Blueprint schematic: a generator with known true curves produces weekly spend and sales. These feed a log-posterior and Metropolis-Hastings sampler, together with adstock and Hill saturation priors. The posterior draws feed a response table, a greedy optimizer with min/max constraints, and an allocation with a 90% interval scored on the true curves. A side branch lists indistinguishable channel pairs.</desc>
<defs>
<pattern id="mn" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="mj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{fill:#EAF3FB;letter-spacing:0.06em;text-transform:uppercase;text-anchor:middle}
.t{font-size:10px}
.s{font-size:9px;fill-opacity:0.7}
.b{fill:#0D3B66;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.k{fill:#0D3B66;stroke:#9FDBFF;stroke-width:1}
.a{stroke:#9FDBFF;stroke-width:1;fill:none}
.n{stroke:#EAF3FB;stroke-opacity:0.6;stroke-width:1;fill:none}
.v{font-size:11px;fill:#9FDBFF}
</style>
</defs>
<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#mn)"/>
<rect width="640" height="360" fill="url(#mj)"/>

<rect x="16" y="16" width="608" height="24" class="b" fill-opacity="0"/>
<text x="28" y="32" class="t" style="text-anchor:start">PN-06 · MIXPRIORS · BAYESIAN MEDIA MIX PIPELINE</text>

<!-- readouts top -->
<rect x="16" y="68" width="128" height="30" class="b" stroke-dasharray="3 2"/>
<text x="80" y="87" class="v">9 CHANNELS</text>
<rect x="176" y="68" width="128" height="30" class="b" stroke-dasharray="3 2"/>
<text x="240" y="87" class="v">156 WEEKS</text>
<line x1="80" y1="98" x2="80" y2="148" class="n" stroke-dasharray="2 3"/>
<line x1="240" y1="98" x2="240" y2="148" class="n" stroke-dasharray="2 3"/>

<!-- row 0 -->
<rect x="336" y="60" width="128" height="48" class="b"/>
<text x="400" y="81" class="t">PRIORS</text>
<text x="400" y="96" class="s">ADSTOCK · HILL SAT.</text>
<rect x="496" y="60" width="128" height="48" class="b" stroke-dasharray="4 3"/>
<text x="560" y="81" class="t">INDISTINGUISHABLE</text>
<text x="560" y="96" class="s">CHANNEL PAIRS</text>

<!-- row A -->
<rect x="16" y="148" width="128" height="52" class="k"/>
<text x="80" y="170" class="t">GENERATOR</text>
<text x="80" y="185" class="s">KNOWN TRUE CURVES</text>
<rect x="176" y="148" width="128" height="52" class="k"/>
<text x="240" y="170" class="t">WEEKLY DATA</text>
<text x="240" y="185" class="s">SPEND AND SALES</text>
<rect x="336" y="148" width="128" height="52" class="k"/>
<text x="400" y="170" class="t">LOG-POSTERIOR</text>
<text x="400" y="185" class="s">+ MH SAMPLER</text>
<rect x="496" y="148" width="128" height="52" class="k"/>
<text x="560" y="170" class="t">POSTERIOR DRAWS</text>
<text x="560" y="185" class="s">SAMPLER OUTPUT</text>

<!-- row B -->
<rect x="496" y="240" width="128" height="52" class="k"/>
<text x="560" y="262" class="t">RESPONSE TABLE</text>
<text x="560" y="277" class="s">CHANNEL × SPEND</text>
<rect x="336" y="240" width="128" height="52" class="k"/>
<text x="400" y="262" class="t">GREEDY OPTIMIZER</text>
<text x="400" y="277" class="s">MIN/MAX CONSTRAINTS</text>
<rect x="176" y="240" width="128" height="52" class="k"/>
<text x="240" y="262" class="t">ALLOCATION</text>
<text x="240" y="277" class="s">WITH 90% INTERVAL</text>
<rect x="16" y="240" width="128" height="52" class="k"/>
<text x="80" y="262" class="t">SCORED</text>
<text x="80" y="277" class="s">ON TRUE CURVES</text>

<!-- readout bottom -->
<rect x="16" y="308" width="176" height="32" class="b" stroke-dasharray="3 2"/>
<text x="104" y="321" class="s">UPLIFT ON TRUE CURVES</text>
<text x="104" y="335" class="v">+2.77% VS -1.18%</text>
<line x1="80" y1="292" x2="80" y2="308" class="n" stroke-dasharray="2 3"/>

<!-- arrows key path -->
<line x1="144" y1="174" x2="174" y2="174" class="a" marker-end="url(#ac)"/>
<line x1="304" y1="174" x2="334" y2="174" class="a" marker-end="url(#ac)"/>
<line x1="464" y1="174" x2="494" y2="174" class="a" marker-end="url(#ac)"/>
<line x1="560" y1="200" x2="560" y2="238" class="a" marker-end="url(#ac)"/>
<line x1="496" y1="266" x2="466" y2="266" class="a" marker-end="url(#ac)"/>
<line x1="336" y1="266" x2="306" y2="266" class="a" marker-end="url(#ac)"/>
<line x1="176" y1="266" x2="146" y2="266" class="a" marker-end="url(#ac)"/>
<!-- secondary -->
<line x1="400" y1="108" x2="400" y2="146" class="n" marker-end="url(#ah)"/>
<line x1="560" y1="148" x2="560" y2="110" class="n" stroke-dasharray="4 3" marker-end="url(#ah)"/>
</svg>