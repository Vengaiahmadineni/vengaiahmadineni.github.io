<text x="90" y="206" class="s">FACT STREAM</text>
<line x1="136" y1="276" x2="200" y2="276" class="l" marker-end="url(#aw)"/>
<line x1="340" y1="276" x2="456" y2="276" class="l" marker-end="url(#aw)"/>
<text x="398" y="268" class="s" text-anchor="middle">ONLINE VALUES</text>
<line x1="540" y1="172" x2="540" y2="250" class="l" marker-end="url(#aw)"/>
<text x="534" y="214" class="s" text-anchor="end">OFFLINE VALUES</text>

<line x1="540" y1="302" x2="540" y2="312" class="l"/>
<rect x="456" y="312" width="168" height="26" class="k"/>
<text x="464" y="329" class="a">SKEW MISMATCHES 0 / 40000</text>

<text x="16" y="332" class="s">READ API HAS NO KNOWLEDGE-TIME PARAMETER</text>
</svg>